<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto – NotCopy</title>
    <link rel="stylesheet" href="/css/contacto.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Fondo animado -->
    <div class="animated-bg"></div>

    <!-- Header -->
    <header class="header">
      <h1>NotCopy</h1>
      <nav>
        <a href="#">Perfil</a>
        <a href="#">Ajustes</a>
        <a href="/">Cerrar sesión</a>
      </nav>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <ul>
          <li>
            <a href="/recursos"><i class="fas fa-home"></i> Inicio</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-download"></i> Descargas</a>
          </li>
          <li>
            <a href="/dashboard"><i class="fas fa-star"></i> Favoritos</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-headset"></i> Soporte</a>
          </li>
          <li>
            <a href="/about"
              ><i class="fas fa-info-circle"></i> Sobre NotCopy</a
            >
          </li>
          <li>
            <a href="#"><i class="fas fa-folder"></i> Recursos</a>
          </li>
          <li>
            <a href="/contacto" class="active"
              ><i class="fas fa-envelope"></i> Contacto</a
            >
          </li>
        </ul>
      </aside>

      <!-- Main -->
      <main class="main">
        <section class="contact">
          <h2>Contáctanos</h2>
          <div class="contact-box">
            <form action="/contacto" method="POST">
              <label for="name">Nombre completo</label>
              <input type="text" id="name" name="name" required />

              <label for="email">Correo electrónico</label>
              <input type="email" id="email" name="email" required />

              <label for="subject">Asunto</label>
              <input type="text" id="subject" name="subject" required />

              <label for="message">Mensaje</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                required
              ></textarea>

              <input type="submit" value="Enviar mensaje" />
            </form>
          </div>
        </section>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2025 NotCopy. Todos los derechos reservados.</p>
      <div class="socials">
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
      </div>
    </footer>
  </body>
</html>
